<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUSHB - Бесплатная рулетка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f1015; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        
        h1 { color: #ccff00; font-size: 26px; text-transform: uppercase; margin-bottom: 2px; text-align: center; }
        .subtitle { color: #8a8d98; font-size: 11px; text-transform: uppercase; margin-bottom: 20px; text-align: center; letter-spacing: 1px; }

        /* Вкладки */
        .tabs { display: flex; width: 100%; background: #161821; border-radius: 14px; padding: 4px; margin-top: 15px; border: 1px solid #2a2d3d; flex-shrink: 0; }
        .tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: 600; color: #8a8d98; cursor: pointer; border-radius: 10px; transition: 0.2s; }
        .tab.active { background: #1f222e; color: #ccff00; }

        .view-section { width: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
        .view-section.active { display: flex; }

        /* Рулетка */
        .roulette-box { width: 100%; background: #161821; border: 1px solid #2a2d3d; border-radius: 16px; padding: 20px; display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 15px; height: 150px; overflow: hidden; }
        .pointer-top, .pointer-bottom { position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; z-index: 10; }
        .pointer-top { top: 6px; border-top: 10px solid #ccff00; }
        .pointer-bottom { bottom: 6px; border-bottom: 10px solid #ccff00; }
        
        .items-track { display: flex; gap: 10px; position: absolute; will-change: transform; }
        .item-card { min-width: 95px; height: 100px; background: #1f222e; border: 1px solid #2f3347; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; text-align: center; }
        .item-icon { font-size: 24px; margin-bottom: 6px; }
        .item-name { font-size: 11px; font-weight: 600; color: #fff; }

        .spin-btn { width: 100%; background: #ccff00; color: #000; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-bottom: 8px; transition: opacity 0.2s; }
        .spin-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
        .cooldown-text { font-size: 11px; color: #8a8d98; text-align: center; }

        /* Инвентарь и Админка */
        .content-box { width: 100%; max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; padding-right: 2px; }
        .inventory-item { background: #161821; border: 1px solid #2a2d3d; border-radius: 12px; padding: 10px; display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .inv-info { display: flex; align-items: center; gap: 10px; }
        .inv-icon { font-size: 22px; }
        .inv-name { font-size: 12px; font-weight: bold; }
        .inv-code { font-size: 11px; color: #ccff00; background: #0f1015; padding: 4px 8px; border-radius: 6px; font-family: monospace; }

        /* Подвкладки админки */
        .admin-subtabs { display: flex; gap: 4px; width: 100%; margin-bottom: 10px; }
        .admin-subtab { flex: 1; background: #161821; border: 1px solid #2a2d3d; padding: 6px; text-align: center; font-size: 11px; border-radius: 8px; color: #8a8d98; cursor: pointer; }
        .admin-subtab.active { background: #1f222e; color: #ccff00; border-color: #ccff00; }
        
        .admin-pane { display: none; width: 100%; flex-direction: column; gap: 8px; }
        .admin-pane.active { display: flex; }

        .admin-card { background: #161821; border: 1px solid #2a2d3d; border-radius: 10px; padding: 10px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .admin-card input, .admin-card select { background: #0f1015; border: 1px solid #333; color: #fff; padding: 6px; border-radius: 6px; font-size: 11px; width: 100%; margin-bottom: 4px; }
        .admin-btn { background: #ccff00; color: #000; border: none; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 10px; text-align: center; }
        .admin-btn.ban { background: #ff4747; color: #fff; }
        .admin-btn.danger { background: #b30000; color: #fff; }

        .footer-bot { font-size: 10px; color: #555868; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- Вкладка: Рулетка -->
    <div id="roulette-view" class="view-section active">
        <h1>RUSHB</h1>
        <div class="subtitle">Бесплатная рулетка</div>

        <div class="roulette-box">
            <div class="pointer-top"></div>
            <div class="pointer-bottom"></div>
            <div class="items-track" id="track"></div>
        </div>

        <button id="spin-button" class="spin-btn" onclick="spinWheel()">КРУТИМ...</button>
        <div class="cooldown-text" id="cooldown-label">1 бесплатный прокрут каждые 24 часа</div>
    </div>

    <!-- Вкладка: Инвентарь -->
    <div id="inventory-view" class="view-section">
        <h1>Инвентарь</h1>
        <div class="subtitle">Ваши выигранные призы</div>
        <div id="inventory-list" class="content-box">
            <div style="text-align: center; color: #666; margin-top: 40px;">Загрузка...</div>
        </div>
    </div>

    <!-- Вкладка: Админ-панель (отображается только для админов) -->
    <div id="admin-view" class="view-section">
        <h1>Админка</h1>
        <div class="subtitle">Управление проектом</div>
        
        <div class="admin-subtabs">
            <div class="admin-subtab active" onclick="switchAdminTab('prizes')">Призы</div>
            <div class="admin-subtab" onclick="switchAdminTab('users')">Юзеры</div>
            <div class="admin-subtab" onclick="switchAdminTab('admins')">Админы</div>
        </div>

        <!-- Подвкладка: Призы -->
        <div id="admin-prizes" class="admin-pane active content-box">
            <div style="background: #161821; border: 1px solid #2a2d3d; border-radius: 10px; padding: 10px;">
                <b style="font-size: 11px; color: #ccff00;">Добавить приз:</b>
                <input type="text" id="new-prize-name" placeholder="Название приза" style="background:#0f1015; border:1px solid #333; color:#fff; padding:6px; width:100%; border-radius:6px; font-size:11px; margin-top:4px;">
                <input type="text" id="new-prize-desc" placeholder="Описание" style="background:#0f1015; border:1px solid #333; color:#fff; padding:6px; width:100%; border-radius:6px; font-size:11px; margin-top:4px;">
                <div style="display:flex; gap:4px; margin-top:4px;">
                    <input type="text" id="new-prize-icon" placeholder="Иконка (🎮)" style="background:#0f1015; border:1px solid #333; color:#fff; padding:6px; width:50%; border-radius:6px; font-size:11px;">
                    <input type="number" id="new-prize-weight" placeholder="Шанс (вес)" value="20" style="background:#0f1015; border:1px solid #333; color:#fff; padding:6px; width:50%; border-radius:6px; font-size:11px;">
                </div>
                <button class="admin-btn" style="width:100%; margin-top:6px; padding:8px;" onclick="addPrize()">Создать приз</button>
            </div>
            <div id="admin-prizes-list" style="display:flex; flex-direction:column; gap:6px; margin-top:4px;"></div>
        </div>

        <!-- Подвкладка: Пользователи -->
        <div id="admin-users" class="admin-pane content-box">
            <div id="admin-users-list" style="display:flex; flex-direction:column; gap:6px;"></div>
        </div>

        <!-- Подвкладка: Админы -->
        <div id="admin-admins" class="admin-pane content-box">
            <div style="background: #161821; border: 1px solid #2a2d3d; border-radius: 10px; padding: 10px;">
                <b style="font-size: 11px; color: #ccff00;">Добавить администратора:</b>
                <input type="text" id="admin-username-input" placeholder="Юзернейм (без @)" style="background:#0f1015; border:1px solid #333; color:#fff; padding:6px; width:100%; border-radius:6px; font-size:11px; margin-top:4px;">
                <button class="admin-btn" style="width:100%; margin-top:6px; padding:8px;" onclick="modifyAdmin('add_admin')">Добавить админа</button>
            </div>
            <div id="admin-admins-list" style="display:flex; flex-direction:column; gap:6px; margin-top:4px;"></div>
        </div>
    </div>

    <!-- Общее нижнее меню навигации -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('roulette')">Рулетка</div>
        <div class="tab" onclick="switchTab('inventory')">Инвентарь</div>
        <div class="tab" id="tab-admin-btn" style="display: none;" onclick="switchTab('admin')">Админка</div>
    </div>

    <div class="footer-bot">@cyber_fdsafdasdfasfa_bot</div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "123456789";
    const username = tg?.initDataUnsafe?.user?.username || "ropogku";

    let prizes = [];
    let nextSpinTimestamp = 0;
    let timerInterval = null;
    let isSpinning = false;

    async function initApp() {
        try {
            const res = await fetch(`/api/status?userId=${userId}&username=${username}`);
            const data = await res.json();

            prizes = data.prizes;
            renderTrack(prizes);

            if (data.isAdmin) {
                document.getElementById('tab-admin-btn').style.display = 'block';
                loadAdminData();
            }

            if (data.nextSpinTime && data.nextSpinTime > Date.now()) {
                nextSpinTimestamp = data.nextSpinTime;
                startTimer();
            } else {
                setSpinButtonState(true, "КРУТИМ...");
            }
        } catch (e) {
            console.error("Ошибка загрузки:", e);
        }
    }

    async function loadAdminData() {
        try {
            const res = await fetch(`/api/admin/data?adminId=${userId}&adminUsername=${username}`);
            const data = await res.json();
            if (!res.ok) return;

            // Список призов
            document.getElementById('admin-prizes-list').innerHTML = data.prizes.map(p => `
                <div class="admin-card">
                    <div><b>${p.icon} ${p.name}</b> <span style="color:#777;">(вес: ${p.weight})</span></div>
                    <button class="admin-btn danger" onclick="deletePrize(${p.id})">Удалить</button>
                </div>
            `).join('');

            // Список пользователей
            const usersContainer = document.getElementById('admin-users-list');
            if (data.users.length === 0) {
                usersContainer.innerHTML = '<div style="color: #666; text-align:center;">Нет пользователей</div>';
            } else {
                usersContainer.innerHTML = data.users.map(u => `
                    <div class="admin-card">
                        <div>
                            <b>@${u.username || 'без юзернейма'}</b> <span style="color:#777; font-size:9px;">(${u.id})</span>
                            ${u.is_banned ? '<span style="color:red">[Бан]</span>' : ''}
                        </div>
                        <div style="display:flex; gap:4px;">
                            <button class="admin-btn" onclick="userAction('${u.id}', '${u.username || ''}', 'reset')">Сброс</button>
                            <button class="admin-btn ban" onclick="userAction('${u.id}', '${u.username || ''}', 'ban')">${u.is_banned ? 'Разбан' : 'Бан'}</button>
                        </div>
                    </div>
                `).join('');
            }

            // Список админов
            document.getElementById('admin-admins-list').innerHTML = data.admins.map(adm => `
                <div class="admin-card">
                    <span>@${adm}</span>
                    <button class="admin-btn danger" onclick="removeAdmin('${adm}')">Удалить</button>
                </div>
            `).join('');

        } catch (e) {
            console.error("Ошибка загрузки админ-данных", e);
        }
    }

    async function addPrize() {
        const name = document.getElementById('new-prize-name').value.trim();
        const description = document.getElementById('new-prize-desc').value.trim();
        const icon = document.getElementById('new-prize-icon').value.trim() || '🎁';
        const weight = parseInt(document.getElementById('new-prize-weight').value) || 10;

        if (!name) { alert('Введите название приза'); return; }

        try {
            const res = await fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminId: userId, adminUsername: username, actionType: 'add_prize', prizeData: { name, description, icon, weight } })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) {
                document.getElementById('new-prize-name').value = '';
                document.getElementById('new-prize-desc').value = '';
                document.getElementById('new-prize-icon').value = '';
                loadAdminData();
                initApp();
            }
        } catch (e) { alert('Ошибка запроса'); }
    }

    async function deletePrize(id) {
        if (!confirm('Удалить этот приз?')) return;
        try {
            const res = await fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminId: userId, adminUsername: username, actionType: 'delete_prize', prizeData: { id } })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) { loadAdminData(); initApp(); }
        } catch (e) { alert('Ошибка запроса'); }
    }

    async function modifyAdmin(actionType) {
        const targetUsername = document.getElementById('admin-username-input').value.trim();
        if (!targetUsername) { alert('Введите юзернейм'); return; }

        try {
            const res = await fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminId: userId, adminUsername: username, targetUsername, actionType })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) { document.getElementById('admin-username-input').value = ''; loadAdminData(); }
        } catch (e) { alert('Ошибка запроса'); }
    }

    async function removeAdmin(targetUsername) {
        try {
            const res = await fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminId: userId, adminUsername: username, targetUsername, actionType: 'remove_admin' })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) loadAdminData();
        } catch (e) { alert('Ошибка запроса'); }
    }

    async function userAction(targetId, targetUsername, actionType) {
        try {
            const res = await fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminId: userId, adminUsername: username, targetId, targetUsername, actionType })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) loadAdminData();
        } catch (e) { alert('Ошибка запроса'); }
    }

    function renderTrack(items) {
        const track = document.getElementById('track');
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        track.innerHTML = '';
        
        // Создаем длинную ленту для плавной анимации прокрутки
        const fullList = [];
        for (let i = 0; i < 6; i++) {
            fullList.push(...items);
        }
        
        fullList.forEach(p => {
            track.innerHTML += `
                <div class="item-card">
                    <div class="item-icon">${p.icon}</div>
                    <div class="item-name">${p.name}</div>
                </div>
            `;
        });
    }

    function startTimer() {
        const spinBtn = document.getElementById('spin-button');
        spinBtn.disabled = true;

        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            const diff = nextSpinTimestamp - Date.now();
            if (diff <= 0) {
                clearInterval(timerInterval);
                setSpinButtonState(true, "КРУТИМ...");
                return;
            }

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            spinBtn.innerText = `Ждите: ${hours}ч ${minutes}м ${seconds}с`;
        }, 1000);
    }

    function setSpinButtonState(active, text) {
        const spinBtn = document.getElementById('spin-button');
        spinBtn.disabled = !active;
        spinBtn.innerText = text;
    }

    async function spinWheel() {
        if (isSpinning) return;
        isSpinning = true;
        setSpinButtonState(false, "РОЗЫГРЫШ...");

        try {
            const res = await fetch('/api/spin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, username })
            });
            const data = await res.json();

            if (!res.ok) {
                alert(data.error || "Ошибка прокрутки");
                isSpinning = false;
                initApp();
                return;
            }

            if (data.prizesList) prizes = data.prizesList;

            const track = document.getElementById('track');
            renderTrack(prizes); // Перерендерим ленту под актуальный список

            const winningIndex = prizes.findIndex(p => p.id === data.prize.id);
            const cardWidth = 105; // 95px ширина карточки + 10px gap
            
            // Выбираем круг прокрутки (например, 3-й полный цикл) и смещаем на нужную карточку по центру
            const targetCycle = 3;
            const containerWidth = document.querySelector('.roulette-box').offsetWidth;
            const centerOffset = (containerWidth / 2) - (cardWidth / 2);
            const offset = (targetCycle * prizes.length + winningIndex) * cardWidth - centerOffset;
            
            // Сбрасываем transition и форсируем перерисовку, затем плавно анимируем
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            track.offsetHeight; // force reflow

            track.style.transition = 'transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1)';
            track.style.transform = `translateX(-${offset}px)`;

            setTimeout(() => {
                alert(`Поздравляем! Вы выиграли: ${data.prize.name}\nПромокод: ${data.promoCode}`);
                isSpinning = false;
                nextSpinTimestamp = Date.now() + 24 * 60 * 60 * 1000;
                startTimer();
            }, 4700);

        } catch (e) {
            console.error(e);
            isSpinning = false;
            setSpinButtonState(true, "КРУТИМ...");
        }
    }

    async function loadInventory() {
        const listContainer = document.getElementById('inventory-list');
        listContainer.innerHTML = '<div style="text-align: center; color: #666; margin-top: 40px;">Загрузка...</div>';

        try {
            const res = await fetch(`/api/inventory?userId=${userId}`);
            const items = await res.json();

            if (items.length === 0) {
                listContainer.innerHTML = '<div style="text-align: center; color: #666; margin-top: 40px;">Инвентарь пуст</div>';
                return;
            }

            listContainer.innerHTML = '';
            items.forEach(item => {
                listContainer.innerHTML += `
                    <div class="inventory-item">
                        <div class="inv-info">
                            <div class="inv-icon">${item.icon}</div>
                            <div>
                                <div class="inv-name">${item.name}</div>
                                <div style="font-size: 10px; color: #8a8d98; margin-top: 2px;">${new Date(item.won_at).toLocaleDateString()}</div>
                            </div>
                        </div>
                        <div class="inv-code">${item.promo_code}</div>
                    </div>
                `;
            });
        } catch (e) {
            listContainer.innerHTML = '<div style="text-align: center; color: #ff4747; margin-top: 40px;">Ошибка загрузки</div>';
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));

        if (tabName === 'roulette') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('roulette-view').classList.add('active');
        } else if (tabName === 'inventory') {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('inventory-view').classList.add('active');
            loadInventory();
        } else if (tabName === 'admin') {
            document.getElementById('tab-admin-btn').classList.add('active');
            document.getElementById('admin-view').classList.add('active');
            loadAdminData();
        }
    }

    function switchAdminTab(subTabName) {
        document.querySelectorAll('.admin-subtab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-pane').forEach(p => p.classList.remove('active'));

        if (subTabName === 'prizes') {
            document.querySelectorAll('.admin-subtab')[0].classList.add('active');
            document.getElementById('admin-prizes').classList.add('active');
        } else if (subTabName === 'users') {
            document.querySelectorAll('.admin-subtab')[1].classList.add('active');
            document.getElementById('admin-users').classList.add('active');
        } else if (subTabName === 'admins') {
            document.querySelectorAll('.admin-subtab')[2].classList.add('active');
            document.getElementById('admin-admins').classList.add('active');
        }
    }

    initApp();
</script>

</body>
</html>
