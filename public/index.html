<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Opening Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .roulette-container {
            width: 100%;
            max-width: 600px;
            height: 150px;
            overflow: hidden;
            border: 2px solid #333;
            background: #1e1e1e;
            position: relative;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
        .roulette-item {
            min-width: 120px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #333;
            background: #2a2a2a;
            box-sizing: border-box;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <h1>Кейсы</h1>
    
    <div class="roulette-container">
        <div class="roulette-track" id="track">
            <!-- Элементы генерируются динамически -->
        </div>
    </div>

    <button onclick="startRoll()">Открыть кейс</button>

    <script>
        const items = ['Обычный', 'Редкий', 'Эпический', 'Легендарный', 'Нож'];

        function initRoulette() {
            const track = document.getElementById('track');
            let html = '';
            // Генерируем ленту из 50 элементов для плавной прокрутки
            for (let i = 0; i < 50; i++) {
                const randomItem = items[Math.floor(Math.random() * items.length)];
                html += `<div class="roulette-item"><span>${randomItem}</span></div>`;
            }
            track.innerHTML = html;
        }

        function startRoll() {
            const track = document.getElementById('track');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            
            setTimeout(() => {
                track.style.transition = 'transform 4s cubic-bezier(0.08, 0.82, 0.17, 1)';
                // Рандомная позиция остановки
                const randomOffset = Math.floor(Math.random() * 30) * 120 - 200;
                track.style.transform = `translateX(-${Math.abs(randomOffset)}px)`;
            }, 50);
        }

        initRoulette();
    </script>
</body>
</html>
