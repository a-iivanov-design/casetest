<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Case</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        /* Экран блокировки */
        #banned-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 12, 0.98);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .banned-box {
            background: #181820;
            border: 1px solid #ff3333;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.3);
            max-width: 350px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН БЛОКИРОВКИ -->
    <div id="banned-screen">
        <div class="banned-box">
            <div style="font-size: 54px; margin-bottom: 15px;">🚫</div>
            <h2 style="color: #ff3333; margin-top: 0; margin-bottom: 10px;">Доступ заблокирован</h2>
            <p style="color: #aaa; font-size: 14px; line-height: 1.5; margin-bottom: 20px;">
                Ваш аккаунт был заблокирован администрацией. Вы больше не можете открывать кейсы и пользоваться сервисом.
            </p>
            <div style="background: #111; padding: 8px 15px; border-radius: 6px; font-size: 13px; color: #777; display: inline-block;">
                Статус: <span style="color: #ff3333; font-weight: bold;">В банне</span>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>CYBER CASE</h1>
        <div id="app">
            <p>Загрузка данных...</p>
        </div>
    </div>

    <script>
        // Получаем данные пользователя (например, из Telegram WebApp или дефолтные для теста)
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId') || 'test_user_1';
        const username = urlParams.get('username') || 'mironova92';

        function checkUserStatus() {
            fetch(`/api/status?userId=${userId}&username=${username}`)
                .then(res => res.json())
                .then(data => {
                    if (data.isBanned) {
                        document.getElementById('banned-screen').style.display = 'flex';
                        document.getElementById('app').innerHTML = '<p style="color: #ff3333;">Аккаунт заблокирован.</p>';
                    } else {
                        document.getElementById('app').innerHTML = '<p style="color: #00ffcc;">Добро пожаловать! Можете крутить кейс.</p>';
                    }
                })
                .catch(err => {
                    console.error('Ошибка проверки статуса:', err);
                });
        }

        checkUserStatus();
    </script>
</body>
</html>
