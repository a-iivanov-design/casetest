<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER CASE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #00e676;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            text-transform: uppercase;
            text-shadow: 0 0 10px #00e676;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background: #212121;
            color: #fff;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .tab-btn.active {
            background: #00e676;
            color: #121212;
            border-color: #00e676;
        }

        .view-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .view-section.active {
            display: flex;
        }

        .case-container {
            width: 280px;
            height: 140px;
            background: #212121;
            border: 2px solid #00e676;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 50px;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
        }

        .roller-window {
            width: 300px;
            height: 100px;
            overflow: hidden;
            position: relative;
            background-color: #000;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 20px;
            display: none;
        }

        .roller-content {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
        }

        .prize-item {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #333;
            box-sizing: border-box;
            font-weight: bold;
            font-size: 13px;
        }

        .prize-common { color: #fff; }
        .prize-uncommon { color: #42a5f5; }
        .prize-rare { color: #ab47bc; }
        .prize-epic { color: #ffa726; }

        .selector {
            position: absolute;
            top: 0;
            left: 149px;
            width: 2px;
            height: 100px;
            background-color: #ff1744;
            z-index: 10;
        }

        button.main-btn {
            background: #00e676;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
        }

        button.main-btn:disabled {
            background: #616161;
            cursor: not-allowed;
        }

        #result-message {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            min-height: 2.5em;
        }

        .inventory-list, .admin-list {
            width: 310px;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .inventory-card, .admin-card {
            background: #212121;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .admin-card input {
            width: 45px;
            background: #121212;
            color: #00e676;
            border: 1px solid #00e676;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        .admin-card button {
            background: #ff1744;
            color: #fff;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .add-prize-form {
            width: 310px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .add-prize-form input {
            background: #212121;
            border: 1px solid #333;
            color: #fff;
            padding: 6px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>Кибер Кейс клуба</h1>

    <div class="nav-tabs" id="nav-tabs">
        <button class="tab-btn active" id="tab-case" onclick="switchTab('case')">Кейс</button>
        <button class="tab-btn" id="tab-inventory" onclick="switchTab('inventory')">Инвентарь</button>
    </div>

    <!-- Вкладка Кейса -->
    <div id="section-case" class="view-section active">
        <div class="case-container" id="case-visual">🎁</div>

        <div class="roller-window" id="roller-window">
            <div class="selector"></div>
            <div class="roller-content" id="roller-content"></div>
        </div>

        <button class="main-btn" id="action-button" onclick="startCase()">Открыть кейс</button>
        <div id="result-message"></div>
    </div>

    <!-- Вкладка Инвентаря -->
    <div id="section-inventory" class="view-section">
        <div class="inventory-list" id="inventory-list">
            <div style="text-align: center; color: #777;">Загрузка...</div>
        </div>
    </div>

    <!-- Вкладка Админки -->
    <div id="section-admin" class="view-section">
        <div style="font-size: 12px; margin-bottom: 5px; color: #aaa;">Управление призами:</div>
        <div class="admin-list" id="admin-prizes-list">
            <div style="text-align: center; color: #777;">Загрузка...</div>
        </div>
        
        <div class="add-prize-form">
            <input type="text" id="new-name" placeholder="Название приза">
            <input type="text" id="new-icon" placeholder="Иконка (эмодзи)">
            <input type="text" id="new-rarity" placeholder="Редкость (common/uncommon/rare/epic)">
            <input type="number" id="new-weight" placeholder="Шанс (вес)">
            <input type="text" id="new-promo" placeholder="Префикс промокода">
            <button class="main-btn" style="font-size: 11px; padding: 6px;" onclick="addPrize()">Добавить приз</button>
        </div>

        <!-- Секция добавления админов -->
        <div id="super-admin-section" style="display:none; width: 310px; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
            <div style="font-size: 12px; margin-bottom: 5px; color: #ff1744;">Добавить админа по юзернейму:</div>
            <div class="add-prize-form">
                <input type="text" id="new-admin-username" placeholder="Юзернейм (например: @ivan_admin)">
                <input type="text" id="new-club-id" placeholder="ID клуба (например: club_spb)">
                <button class="main-btn" style="font-size: 11px; padding: 6px; background: #ff1744; color: #fff;" onclick="addNewAdmin()">Назначить админом</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'test_user';
        const username = tg.initDataUnsafe?.user?.username || '';

        const allPrizesList = [
            { name: '30 мин', icon: '⏳', rarity: 'common' },
            { name: '1 час', icon: '⏰', rarity: 'uncommon' },
            { name: 'Энергетик', icon: '⚡', rarity: 'uncommon' },
            { name: '3 часа', icon: '🎮', rarity: 'rare' },
            { name: 'Ночной пакет', icon: '🌙', rarity: 'epic' }
        ];

        let isSpinning = false;
        let isSuperAdmin = false;

        async function checkAdminAccess() {
            try {
                const res = await fetch(`/api/admin/check?userId=${userId}&username=${username}`);
                const data = await res.json();
                if (data.isAdmin) {
                    isSuperAdmin = data.isSuper;
                    const tabsNav = document.getElementById('nav-tabs');
                    const adminTabBtn = document.createElement('button');
                    adminTabBtn.className = 'tab-btn';
                    adminTabBtn.id = 'tab-admin';
                    adminTabBtn.innerText = '⚙️ Админка';
                    adminTabBtn.onclick = () => switchTab('admin');
                    tabsNav.appendChild(adminTabBtn);

                    if (isSuperAdmin) {
                        document.getElementById('super-admin-section').style.display = 'block';
                    }
                }
            } catch (e) {
                console.error('Ошибка проверки админа', e);
            }
        }
        checkAdminAccess();

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));

            if (tab === 'case') {
                document.getElementById('tab-case').classList.add('active');
                document.getElementById('section-case').classList.add('active');
            } else if (tab === 'inventory') {
                document.getElementById('tab-inventory').classList.add('active');
                document.getElementById('section-inventory').classList.add('active');
                loadInventory();
            } else if (tab === 'admin') {
                document.getElementById('tab-admin').classList.add('active');
                document.getElementById('section-admin').classList.add('active');
                loadAdminPrizes();
            }
        }

        async function loadInventory() {
            const listEl = document.getElementById('inventory-list');
            listEl.innerHTML = '<div style="text-align: center; color: #777;">Загрузка...</div>';
            try {
                const res = await fetch(`/api/inventory?userId=${userId}`);
                const data = await res.json();
                if (!data.items || data.items.length === 0) {
                    listEl.innerHTML = '<div style="text-align: center; color: #777;">У вас пока нет призов</div>';
                    return;
                }
                listEl.innerHTML = '';
                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'inventory-card';
                    
                    let promoBlock = `<div style="color: #ff1744; font-weight: bold;">${item.promo}</div>`;
                    let statusText = `<span style="font-size:10px; color:#888;">Получено: ${new Date(item.won_at).toLocaleString()}</span>`;

                    if (item.isExpired) {
                        promoBlock = `<div style="color: #616161; font-weight: bold; text-decoration: line-through;">Срок истек</div>`;
                        statusText = `<span style="font-size:10px; color:#ff1744;">Просрочено (> 2 дней)</span>`;
                    }

                    card.innerHTML = `
                        <div><b>${item.icon} ${item.prize_name}</b><br>${statusText}</div>
                        ${promoBlock}
                    `;
                    listEl.appendChild(card);
                });
            } catch (e) {
                listEl.innerHTML = '<div style="text-align: center; color: #ff1744;">Ошибка загрузки</div>';
            }
        }

        async function loadAdminPrizes() {
            const listEl = document.getElementById('admin-prizes-list');
            listEl.innerHTML = '<div style="text-align: center; color: #777;">Загрузка...</div>';
            try {
                const res = await fetch(`/api/admin/prizes?userId=${userId}&username=${username}`);
                const data = await res.json();
                if (!data.prizes) return;

                listEl.innerHTML = '';
                data.prizes.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'admin-card';
                    card.innerHTML = `
                        <div>${p.icon} <b>${p.name}</b></div>
                        <div style="display: flex; gap: 5px; align-items: center;">
                            <input type="number" id="weight-${p.id}" value="${p.weight}" onchange="updateWeight(${p.id})">
                            <button onclick="deletePrize(${p.id})">X</button>
                        </div>
                    `;
                    listEl.appendChild(card);
                });
            } catch (e) {
                listEl.innerHTML = '<div style="text-align: center; color: #ff1744;">Ошибка загрузки</div>';
            }
        }

        async function updateWeight(prizeId) {
            const newWeight = document.getElementById(`weight-${prizeId}`).value;
            await fetch('/api/admin/update-prize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, username, prizeId, weight: Number(newWeight) })
            });
        }

        async function addPrize() {
            const name = document.getElementById('new-name').value;
            const icon = document.getElementById('new-icon').value;
            const rarity = document.getElementById('new-rarity').value;
            const weight = Number(document.getElementById('new-weight').value);
            const promo_prefix = document.getElementById('new-promo').value;

            if (!name || !weight) return alert('Заполните название и шанс!');

            await fetch('/api/admin/add-prize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, username, name, icon, rarity, weight, promo_prefix })
            });
            loadAdminPrizes();
        }

        async function deletePrize(prizeId) {
            await fetch('/api/admin/delete-prize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, username, prizeId })
            });
            loadAdminPrizes();
        }

        async function addNewAdmin() {
            const newAdminUsername = document.getElementById('new-admin-username').value;
            const clubId = document.getElementById('new-club-id').value;

            if (!newAdminUsername || !clubId) return alert('Введите юзернейм и ID клуба!');

            const res = await fetch('/api/admin/add-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, username, newAdminUsername, clubId })
            });
            const data = await res.json();
            if (data.success) {
                alert('Администратор успешно назначен!');
                document.getElementById('new-admin-username').value = '';
                document.getElementById('new-club-id').value = '';
            } else {
                alert(data.error || 'Ошибка');
            }
        }

        async function startCase() {
            if (isSpinning) return;
            isSpinning = true;

            const btn = document.getElementById('action-button');
            const visual = document.getElementById('case-visual');
            const windowEl = document.getElementById('roller-window');
            const content = document.getElementById('roller-content');
            const msg = document.getElementById('result-message');

            btn.disabled = true;
            btn.innerText = 'Выбираем приз...';
            msg.innerText = '';
            visual.style.display = 'none';
            windowEl.style.display = 'block';

            let serverData = null;

            try {
                const response = await fetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, username, clubId: 'default_club' })
                });
                serverData = await response.json();

                if (response.status !== 200) {
                    isSpinning = false;
                    btn.disabled = false;
                    btn.innerText = 'Открыть кейс';
                    windowEl.style.display = 'none';
                    visual.style.display = 'flex';
                    msg.style.color = '#ff1744';
                    msg.innerText = serverData.error || 'Ошибка';
                    return;
                }
            } catch (e) {
                isSpinning = false;
                btn.disabled = false;
                btn.innerText = 'Открыть кейс';
                windowEl.style.display = 'none';
                visual.style.display = 'flex';
                msg.style.color = '#ff1744';
                msg.innerText = 'Ошибка соединения';
                return;
            }

            const winningPrize = serverData.prize;

            content.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                const randomTemplate = allPrizesList[Math.floor(Math.random() * allPrizesList.length)];
                const p = (i === 30) ? winningPrize : randomTemplate;
                
                const div = document.createElement('div');
                div.className = `prize-item prize-${p.rarity}`;
                div.innerHTML = `<div>${p.icon}</div><div>${p.name}</div>`;
                content.appendChild(div);
            }

            content.style.transition = 'none';
            content.style.left = '0px';

            const targetLeft = -(30 * 100 - 150 + 50);

            setTimeout(() => {
                content.style.transition = 'left 4s cubic-bezier(0.1, 0.8, 0.2, 1)';
                content.style.left = `${targetLeft}px`;
            }, 50);

            setTimeout(() => {
                isSpinning = false;
                btn.innerText = 'Ещё раз (без лимита)';
                msg.style.color = '#00e676';
                msg.innerHTML = `🎉 Вы выиграли: <b>${winningPrize.name}</b>!<br>Промокод: <span style="color: #ff1744">${serverData.promo}</span><br><span style="font-size:11px; color:#aaa;">Действует 48 часов!</span>`;
            }, 4100);
        }
    </script>
</body>
</html>
