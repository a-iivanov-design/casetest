<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER CASE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #00e676;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            text-transform: uppercase;
            text-shadow: 0 0 10px #00e676;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: #212121;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .tab-btn.active {
            background: #00e676;
            color: #121212;
            border-color: #00e676;
        }

        .view-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .view-section.active {
            display: flex;
        }

        .case-container {
            width: 280px;
            height: 140px;
            background: #212121;
            border: 2px solid #00e676;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 50px;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
        }

        .roller-window {
            width: 300px;
            height: 100px;
            overflow: hidden;
            position: relative;
            background-color: #000;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 20px;
            display: none;
        }

        .roller-content {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
        }

        .prize-item {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #333;
            box-sizing: border-box;
            font-weight: bold;
            font-size: 13px;
        }

        .prize-common { color: #fff; }
        .prize-uncommon { color: #42a5f5; }
        .prize-rare { color: #ab47bc; }
        .prize-epic { color: #ffa726; }

        .selector {
            position: absolute;
            top: 0;
            left: 149px;
            width: 2px;
            height: 100px;
            background-color: #ff1744;
            z-index: 10;
        }

        button.main-btn {
            background: #00e676;
            color: #121212;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
        }

        button.main-btn:disabled {
            background: #616161;
            cursor: not-allowed;
        }

        #result-message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            min-height: 2.5em;
        }

        .inventory-list {
            width: 300px;
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .inventory-card {
            background: #212121;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-card .info {
            font-size: 14px;
        }

        .inventory-card .promo {
            color: #ff1744;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Кибер Кейс клуба</h1>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tab-case" onclick="switchTab('case')">Кейс</button>
        <button class="tab-btn" id="tab-inventory" onclick="switchTab('inventory')">Инвентарь</button>
    </div>

    <!-- Вкладка Кейса -->
    <div id="section-case" class="view-section active">
        <div class="case-container" id="case-visual">🎁</div>

        <div class="roller-window" id="roller-window">
            <div class="selector"></div>
            <div class="roller-content" id="roller-content"></div>
        </div>

        <button class="main-btn" id="action-button" onclick="startCase()">Открыть кейс</button>
        <div id="result-message"></div>
    </div>

    <!-- Вкладка Инвентаря -->
    <div id="section-inventory" class="view-section">
        <div class="inventory-list" id="inventory-list">
            <div style="text-align: center; color: #777;">Загрузка инвентаря...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'test_user';

        const allPrizesList = [
            { name: '30 мин', icon: '⏳', rarity: 'common' },
            { name: '1 час', icon: '⏰', rarity: 'uncommon' },
            { name: 'Энергетик', icon: '⚡', rarity: 'uncommon' },
            { name: '3 часа', icon: '🎮', rarity: 'rare' },
            { name: 'Ночной пакет', icon: '🌙', rarity: 'epic' }
        ];

        let isSpinning = false;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));

            if (tab === 'case') {
                document.getElementById('tab-case').classList.add('active');
                document.getElementById('section-case').classList.add('active');
            } else {
                document.getElementById('tab-inventory').classList.add('active');
                document.getElementById('section-inventory').classList.add('active');
                loadInventory();
            }
        }

        async function loadInventory() {
            const listEl = document.getElementById('inventory-list');
            listEl.innerHTML = '<div style="text-align: center; color: #777;">Загрузка...</div>';

            try {
                const res = await fetch(`/api/inventory?userId=${userId}`);
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    listEl.innerHTML = '<div style="text-align: center; color: #777;">У вас пока нет призов</div>';
                    return;
                }

                listEl.innerHTML = '';
                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'inventory-card';
                    card.innerHTML = `
                        <div class="info">
                            <div><b>${item.icon} ${item.prize_name}</b></div>
                            <div style="font-size: 11px; color: #888;">${new Date(item.won_at).toLocaleString()}</div>
                        </div>
                        <div class="promo">${item.promo}</div>
                    `;
                    listEl.appendChild(card);
                });
            } catch (e) {
                listEl.innerHTML = '<div style="text-align: center; color: #ff1744;">Ошибка загрузки</div>';
            }
        }

        async function startCase() {
            if (isSpinning) return;
            isSpinning = true;

            const btn = document.getElementById('action-button');
            const visual = document.getElementById('case-visual');
            const windowEl = document.getElementById('roller-window');
            const content = document.getElementById('roller-content');
            const msg = document.getElementById('result-message');

            btn.disabled = true;
            btn.innerText = 'Выбираем приз...';
            msg.innerText = '';
            visual.style.display = 'none';
            windowEl.style.display = 'block';

            let serverData = null;

            try {
                const response = await fetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, clubId: 'default_club' })
                });
                serverData = await response.json();

                if (response.status !== 200) {
                    isSpinning = false;
                    btn.disabled = false;
                    btn.innerText = 'Открыть кейс';
                    windowEl.style.display = 'none';
                    visual.style.display = 'flex';
                    msg.style.color = '#ff1744';
                    msg.innerText = serverData.error || 'Произошла ошибка';
                    return;
                }
            } catch (e) {
                isSpinning = false;
                btn.disabled = false;
                btn.innerText = 'Открыть кейс';
                windowEl.style.display = 'none';
                visual.style.display = 'flex';
                msg.style.color = '#ff1744';
                msg.innerText = 'Ошибка соединения с сервером';
                return;
            }

            const winningPrize = serverData.prize;

            content.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                const randomTemplate = allPrizesList[Math.floor(Math.random() * allPrizesList.length)];
                const p = (i === 30) ? winningPrize : randomTemplate;
                
                const div = document.createElement('div');
                div.className = `prize-item prize-${p.rarity}`;
                div.innerHTML = `<div>${p.icon}</div><div>${p.name}</div>`;
                content.appendChild(div);
            }

            content.style.transition = 'none';
            content.style.left = '0px';

            const targetLeft = -(30 * 100 - 150 + 50);

            setTimeout(() => {
                content.style.transition = 'left 4s cubic-bezier(0.1, 0.8, 0.2, 1)';
                content.style.left = `${targetLeft}px`;
            }, 50);

            setTimeout(() => {
                isSpinning = false;
                btn.innerText = 'Открыто';
                msg.style.color = '#00e676';
                msg.innerHTML = `🎉 Вы выиграли: <b>${winningPrize.name}</b>!<br>Промокод: <span style="color: #ff1744">${serverData.promo}</span>`;
            }, 4100);
        }
    </script>
</body>
</html>
