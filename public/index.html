<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кибер-Рулетка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --primary: #a3ff00;
            --bg: #0f0f11;
            --card-bg: #18181b;
            --text-main: #ffffff;
            --text-muted: #71717a;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        /* Шапка с кнопкой админки */
        .header-nav {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 10px;
        }

        .admin-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            display: none;
            transition: 0.2s;
        }

        .admin-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Логотип и подзаголовок */
        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .club-logo-text {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--primary);
            text-transform: uppercase;
        }

        .club-logo-img {
            max-height: 40px;
            object-fit: contain;
        }

        .subtitle {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Рулетка */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 160px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Стрелочки-указатели */
        .pointer-top, .pointer-bottom {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            z-index: 10;
        }

        .pointer-top {
            top: 10px;
            border-bottom: 8px solid var(--primary);
        }

        .pointer-bottom {
            bottom: 10px;
            border-top: 8px solid var(--primary);
        }

        .items-track {
            display: flex;
            position: absolute;
            will-change: transform;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        .prize-card {
            min-width: 130px;
            height: 130px;
            margin: 0 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
        }

        .prize-card.highlight {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(163, 255, 0, 0.15);
        }

        .prize-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .prize-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .prize-desc {
            font-size: 10px;
            color: var(--text-muted);
            line-height: 1.1;
        }

        /* Главная кнопка */
        .spin-btn {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 18px;
            font-weight: 800;
            padding: 18px;
            border-radius: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
            margin-bottom: 8px;
        }

        .spin-btn:not(:disabled):hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cooldown-info {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        /* Нижнее переключение (Рулетка / Инвентарь) */
        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 4px;
            width: 100%;
            margin-top: auto;
            margin-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--primary);
            font-weight: 700;
        }

        /* Контентные секции */
        .section {
            display: none;
            width: 100%;
            flex: 1;
            flex-direction: column;
        }

        .section.active {
            display: flex;
        }

        /* Инвентарь */
        .inventory-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 60vh;
            padding-right: 4px;
        }

        .inventory-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inv-info h4 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .inv-info p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .promo-code {
            background: rgba(163, 255, 0, 0.1);
            border: 1px dashed var(--primary);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
        }

        .empty-inv {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 13px;
        }

        /* Экран блокировки */
        #banned-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        #banned-screen h2 { color: #ff453a; margin-bottom: 10px; }
        #banned-screen p { color: var(--text-muted); font-size: 13px; }

        /* Админ панель */
        .admin-panel {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 12px;
        }
        .admin-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
        }
        .admin-card input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
            margin-bottom: 10px;
        }
        .admin-btn-action {
            background: var(--primary);
            color: #000;
            border: none;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="banned-screen">
        <h2>Доступ ограничен</h2>
        <p>Ваш аккаунт заблокирован администрацией клуба.</p>
    </div>

    <div class="container">
        <!-- Шапка -->
        <div class="header-nav">
            <button class="admin-btn" id="adminToggleBtn" onclick="toggleAdminPanel()">← Админка</button>
        </div>

        <!-- Логотип -->
        <div class="logo-container">
            <div id="logoWrapper">
                <!-- Заполняется из конфига -->
            </div>
            <div class="subtitle" id="subTitleText">БЕСПЛАТНАЯ РУЛЕТКА</div>
        </div>

        <!-- СЕКЦИЯ РУЛЕТКИ -->
        <div id="rouletteSection" class="section active">
            <div class="roulette-wrapper">
                <div class="pointer-top"></div>
                <div class="pointer-bottom"></div>
                <div class="items-track" id="itemsTrack">
                    <!-- Элементы генерируются скриптом -->
                </div>
            </div>

            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">КРУТИМ...</button>
            <div class="cooldown-info" id="cooldownText">1 бесплатный прокрут каждые 24 часа</div>
        </div>

        <!-- СЕКЦИЯ ИНВЕНТАРЯ -->
        <div id="inventorySection" class="section">
            <div class="inventory-list" id="inventoryList">
                <div class="empty-inv">Загрузка инвентаря...</div>
            </div>
        </div>

        <!-- СЕКЦИЯ АДМИНКИ -->
        <div id="adminSection" class="section">
            <div class="admin-title">Панель управления</div>
            <div class="admin-card">
                <p>Управление пользователем (Бан / Сброс таймера)</p>
                <input type="text" id="targetUserId" placeholder="Telegram ID юзера">
                <button class="admin-btn-action" onclick="adminAction('reset')">Сбросить таймер</button>
                <button class="admin-btn-action" style="background:#ff453a; color:#fff; margin-left: 6px;" onclick="adminAction('ban')">Бан/Разбан</button>
            </div>
        </div>

        <!-- Нижнее меню -->
        <div class="nav-tabs" id="mainNavTabs">
            <button class="tab-btn active" onclick="switchTab('roulette', this)">Рулетка</button>
            <button class="tab-btn" onclick="switchTab('inventory', this)">Инвентарь</button>
        </div>
    </div>

    <script>
        // Применение конфига
        if (window.APP_CONFIG) {
            document.documentElement.style.setProperty('--primary', window.APP_CONFIG.primaryColor);
            document.documentElement.style.setProperty('--bg', window.APP_CONFIG.bgDark);
            document.documentElement.style.setProperty('--card-bg', window.APP_CONFIG.cardBg);
            
            const logoWrapper = document.getElementById('logoWrapper');
            if (window.APP_CONFIG.logoUrl) {
                logoWrapper.innerHTML = `<img src="${window.APP_CONFIG.logoUrl}" class="club-logo-img" alt="Logo">`;
            } else {
                logoWrapper.innerHTML = `<div class="club-logo-text">${window.APP_CONFIG.clubName}</div>`;
            }

            document.getElementById('subTitleText').innerText = window.APP_CONFIG.subtitle;
            document.getElementById('spinBtn').innerText = window.APP_CONFIG.spinButtonText;
            document.getElementById('cooldownText').innerText = window.APP_CONFIG.cooldownText;
        }

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe?.user || { id: 12345678, first_name: "TestUser" };
        let allPrizes = [];
        let isAdmin = false;

        async function initApp() {
            try {
                let res = await fetch(`/api/status?userId=${user.id}`);
                let data = await res.json();

                if (data.isBanned) {
                    document.getElementById('banned-screen').style.display = 'flex';
                    return;
                }

                if (data.isAdmin) {
                    isAdmin = true;
                    document.getElementById('adminToggleBtn').style.display = 'block';
                }

                allPrizes = data.prizes;
                buildTrack(allPrizes);

                if (data.hoursLeft > 0) {
                    lockSpinButton(data.hoursLeft);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function buildTrack(prizes) {
            const track = document.getElementById('itemsTrack');
            let html = '';
            // Создаем длинную ленту для прокрутки
            let extended = [];
            for(let i=0; i<5; i++) extended = extended.concat(prizes);

            extended.forEach(p => {
                html += `
                    <div class="prize-card">
                        <div class="prize-icon">${p.icon || '🎁'}</div>
                        <div class="prize-title">${p.name}</div>
                        <div class="prize-desc">${p.description || ''}</div>
                    </div>
                `;
            });
            track.innerHTML = html;
        }

        async function spinWheel() {
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;

            try {
                let res = await fetch('/api/spin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: user.id })
                });
                let data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Ошибка');
                    btn.disabled = false;
                    return;
                }

                // Анимация прокрутки к выигранному призу
                const track = document.getElementById('itemsTrack');
                const winningIndex = allPrizes.findIndex(p => p.id === data.prize.id);
                const cardWidth = 146; // 130px width + 16px margins
                // Крутим на несколько циклов вперед + нужный индекс
                const targetOffset = -(cardWidth * (allPrizes.length * 2 + winningIndex) - 130);
                
                track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
                track.style.transform = `translateX(${targetOffset}px)`;

                setTimeout(() => {
                    alert(`Поздравляем! Вы выиграли: ${data.prize.name}\nПромокод: ${data.promoCode}`);
                    lockSpinButton(24);
                    loadInventory();
                }, 4100);

            } catch (e) {
                console.error(e);
                btn.disabled = false;
            }
        }

        function lockSpinButton(hours) {
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.innerText = `КРУТИТЬ ЧЕРЕЗ ${Math.ceil(hours)}Ч`;
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('adminToggleBtn').style.fontWeight = 'normal';

            if (tabName === 'roulette') {
                document.getElementById('rouletteSection').classList.add('active');
            } else if (tabName === 'inventory') {
                document.getElementById('inventorySection').classList.add('active');
                loadInventory();
            }
            el.classList.add('active');
        }

        function toggleAdminPanel() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('adminSection').classList.add('active');
            document.getElementById('adminToggleBtn').style.fontWeight = 'bold';
        }

        async function loadInventory() {
            try {
                let res = await fetch(`/api/inventory?userId=${user.id}`);
                let items = await res.json();
                const list = document.getElementById('inventoryList');

                if (items.length === 0) {
                    list.innerHTML = `<div class="empty-inv">У вас пока нет выигранных призов</div>`;
                    return;
                }

                let html = '';
                items.forEach(item => {
                    html += `
                        <div class="inventory-item">
                            <div class="inv-info">
                                <h4>${item.name}</h4>
                                <p>Выиграно: ${new Date(item.won_at).toLocaleDateString()}</p>
                            </div>
                            <div class="promo-code">${item.promo_code}</div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch (e) {
                console.error(e);
            }
        }

        async function adminAction(actionType) {
            const targetId = document.getElementById('targetUserId').value;
            if (!targetId) return alert('Введите ID пользователя');

            let res = await fetch('/api/admin/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ adminId: user.id, targetId, actionType })
            });
            let data = await res.json();
            alert(data.message || 'Готово');
        }

        initApp();
    </script>
</body>
</html>
