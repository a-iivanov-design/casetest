<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рулетка Призов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        h2, h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 18px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:active {
            background: var(--accent-hover);
        }

        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .inventory-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-card button {
            background: var(--danger);
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Блок Рулетки -->
        <div class="card" style="text-align: center;">
            <h2>Колесо Фортуны</h2>
            <div id="roulette-display" style="font-size: 24px; margin: 20px 0; font-weight: bold;">Нажмите крутить!</div>
            <button id="spin-btn" onclick="spinWheel()">Крутить рулетку</button>
        </div>

        <!-- Инвентарь пользователя -->
        <div class="card">
            <h3>Ваш инвентарь</h3>
            <div id="inventory-list" class="inventory-list">
                <div style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top:20px;">Загрузка...</div>
            </div>
        </div>

        <!-- Админ-панель (скрыта по умолчанию) -->
        <div id="admin-panel" class="card hidden">
            <h3>Админ-панель</h3>
            <p style="font-size: 12px; color: var(--text-muted);">Панель управления призами</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || 123456789; // Тестовый ID для разработки

        document.addEventListener('DOMContentLoaded', () => {
            loadInventory();
        });

        function getIconHtml(icon, size = '20px') {
            return `<span style="font-size: ${size};">${icon || '🎁'}</span>`;
        }

        async function loadInventory() {
            const listEl = document.getElementById('inventory-list');
            try {
                const res = await fetch(`/api/inventory?userId=${userId}`);
                const data = await res.json();
                
                if (!listEl.hasChildNodes() || listEl.querySelector('div[style*="text-align: center"]')) {
                    if (!data.items || data.items.length === 0) {
                        listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top:20px;">Инвентарь пуст</div>';
                        return;
                    }
                    listEl.innerHTML = '';
                    data.items.forEach(item => {
                        listEl.appendChild(createInventoryCardElement(item));
                    });
                    return;
                }

                if (!data.items || data.items.length === 0) {
                    listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top:20px;">Инвентарь пуст</div>';
                    return;
                }

                const existingCards = Array.from(listEl.querySelectorAll('.inventory-card'));
                const serverIds = data.items.map(i => String(i.id));

                existingCards.forEach(card => {
                    const id = card.getAttribute('data-item-id');
                    if (!serverIds.includes(id)) {
                        card.remove();
                    }
                });

                if (listEl.children.length === 0) {
                    listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top:20px;">Инвентарь пуст</div>';
                }
            } catch (e) {
                console.error(e);
            }
        }

        function createInventoryCardElement(item) {
            let formattedDate = '';
            if (item.won_at) {
                const dateObj = new Date(item.won_at);
                if (!isNaN(dateObj)) {
                    formattedDate = dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
                }
            }

            const card = document.createElement('div');
            card.className = 'inventory-card';
            card.setAttribute('data-item-id', item.id);
            card.innerHTML = `
                <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px;">
                    <div style="font-weight:700; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis;">${getIconHtml(item.icon, '20px')} ${item.prize_name}</div>
                    <div style="font-size:10px; color:var(--text-muted);">Код: <span style="color:var(--text-main); font-weight:700;">${item.promo}</span></div>
                    ${formattedDate ? `<div style="font-size:9px; color:var(--text-muted); margin-top:2px;">Получено: ${formattedDate}</div>` : ''}
                    <div style="font-size:9px; color:var(--text-muted); margin-top:1px;">Срок: ${item.hoursLeft}ч</div>
                </div>
                <button type="button" onclick="deleteInventoryItem(${item.id})">Удалить</button>
            `;
            return card;
        }

        async function deleteInventoryItem(itemId) {
            if (!confirm('Удалить приз?')) return;
            
            const cardToRemove = document.querySelector(`.inventory-card[data-item-id="${itemId}"]`);
            if (cardToRemove) {
                cardToRemove.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
                cardToRemove.style.opacity = '0';
                cardToRemove.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    cardToRemove.remove();
                    const listEl = document.getElementById('inventory-list');
                    if (listEl && listEl.children.length === 0) {
                        listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top:20px;">Инвентарь пуст</div>';
                    }
                }, 200);
            }

            try {
                await fetch('/api/inventory/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, itemId })
                });
            } catch (e) {
                console.error('Ошибка при удалении на сервере', e);
                loadInventory();
            }
        }

        function spinWheel() {
            const display = document.getElementById('roulette-display');
            display.innerText = 'Крутим...';
            setTimeout(() => {
                display.innerText = 'Приз выигран!';
                loadInventory();
            }, 1000);
        }
    </script>
</body>
</html>
