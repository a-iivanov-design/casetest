<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUSHB - Бесплатная рулетка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f1015; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; flex: 1; }
        
        h1 { color: #ccff00; font-size: 28px; text-transform: uppercase; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #8a8d98; font-size: 12px; text-transform: uppercase; margin-bottom: 25px; text-align: center; letter-spacing: 1px; }

        #admin-panel { width: 100%; background: #1a1c23; border: 1px solid #ccff00; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: none; }
        #admin-panel h3 { color: #ccff00; font-size: 14px; margin-bottom: 10px; }
        .admin-section { margin-bottom: 12px; font-size: 12px; }
        .admin-section input { width: 100%; background: #0f1015; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 6px; }
        .admin-btns { display: flex; gap: 6px; }
        .admin-btn { flex: 1; background: #ccff00; color: #000; border: none; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; text-align: center; }
        .admin-btn.ban { background: #ff4747; color: #fff; }
        .admin-btn.danger { background: #b30000; color: #fff; }
        
        .lists-box { max-height: 150px; overflow-y: auto; background: #0f1015; border: 1px solid #333; border-radius: 6px; padding: 8px; font-size: 11px; margin-top: 5px; }
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #222; }

        .roulette-box { width: 100%; background: #161821; border: 1px solid #2a2d3d; border-radius: 16px; padding: 20px; display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 20px; height: 160px; overflow: hidden; }
        .pointer-top, .pointer-bottom { position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; z-index: 10; }
        .pointer-top { top: 8px; border-top: 10px solid #ccff00; }
        .pointer-bottom { bottom: 8px; border-bottom: 10px solid #ccff00; }
        
        .items-track { display: flex; gap: 10px; position: absolute; transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .item-card { min-width: 100px; height: 110px; background: #1f222e; border: 1px solid #2f3347; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; text-align: center; }
        .item-icon { font-size: 28px; margin-bottom: 8px; }
        .item-name { font-size: 12px; font-weight: 600; color: #fff; }

        .spin-btn { width: 100%; background: #ccff00; color: #000; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-bottom: 10px; transition: opacity 0.2s; }
        .spin-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
        .cooldown-text { font-size: 11px; color: #8a8d98; text-align: center; margin-bottom: 25px; }

        .tabs { display: flex; width: 100%; background: #161821; border-radius: 14px; padding: 4px; margin-top: auto; border: 1px solid #2a2d3d; }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: 600; color: #8a8d98; cursor: pointer; border-radius: 10px; transition: 0.2s; }
        .tab.active { background: #1f222e; color: #ccff00; }

        .view-section { width: 100%; display: none; flex-direction: column; gap: 10px; flex: 1; }
        .view-section.active { display: flex; }
        .inventory-item { background: #161821; border: 1px solid #2a2d3d; border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .inv-info { display: flex; align-items: center; gap: 12px; }
        .inv-icon { font-size: 24px; }
        .inv-name { font-size: 13px; font-weight: bold; }
        .inv-code { font-size: 11px; color: #ccff00; background: #0f1015; padding: 4px 8px; border-radius: 6px; font-family: monospace; }
        
        .footer-bot { font-size: 11px; color: #555868; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="roulette-view" class="view-section active">
        <h1>RUSHB</h1>
        <div class="subtitle">Бесплатная рулетка</div>

        <div id="admin-panel">
            <h3>Панель администратора</h3>
            
            <div class="admin-section">
                <strong>Администраторы:</strong>
                <div class="lists-box" id="admins-list">Загрузка...</div>
                <div style="display: flex; gap: 6px; margin-top: 6px;">
                    <input type="text" id="admin-username-input" placeholder="Юзернейм (например: ropogku)" style="margin-bottom:0;">
                    <button class="admin-btn" onclick="modifyAdmin('add_admin')">Добавить</button>
                    <button class="admin-btn danger" onclick="modifyAdmin('remove_admin')">Удалить</button>
                </div>
            </div>

            <div class="admin-section" style="margin-bottom: 0;">
                <strong>Пользователи (сброс таймера / бан):</strong>
                <div class="lists-box" id="users-list">Загрузка...</div>
            </div>
        </div>

        <div class="roulette-box">
            <div class="pointer-top"></div>
            <div class="pointer-bottom"></div>
            <div class="items-track" id="track"></div>
        </div>

        <button id="spin-button" class="spin-btn" onclick="spinWheel()">КРУТИМ...</button>
        <div class="cooldown-text">1 бесплатный прокрут каждые 24 часа</div>
    </div>

    <div id="inventory-view" class="view-section">
        <h1>Инвентарь</h1>
        <div class="subtitle">Ваши выигранные призы</div>
        <div id="inventory-list" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
            <div style="text-align: center; color: #666; margin-top: 40px;">Загрузка...</div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('roulette')">Рулетка</div>
        <div class="tab" onclick="switchTab('inventory')">Инвентарь</div>
    </div>

    <div class="footer-bot">@cyber_fdsafdasdfasfa_bot</div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "123456789";
    const username = tg?.initDataUnsafe?.user?.username || "ropogku";

    let prizes = [];
    let nextSpinTimestamp = 0;
    let timerInterval = null;
    let isSpinning = false;

    async function initApp() {
        try {
            const res = await fetch(`/api/status?userId=${userId}&username=${username}`);
            const data = await res.json();

            prizes = data.prizes;
            renderTrack(prizes);

            if (data.isAdmin) {
                document.getElementById('admin-panel').style.display = 'block';
                loadAdminData();
            }

            if (data.nextSpinTime && data.nextSpinTime > Date.now()) {
                nextSpinTimestamp = data.nextSpinTime;
                startTimer();
            } else {
                setSpinButtonState(true, "КРУТИМ...");
            }
        } catch (e) {
            console.error("Ошибка загрузки:", e);
        }
    }

    async function loadAdminData() {
        try {
            const res = await fetch(`/api/admin/data?adminId=${userId}&adminUsername=${username}`);
            const data = await res.json();
            if (!res.ok) return;

            const adminsContainer = document.getElementById('admins-list');
            adminsContainer.innerHTML = data.admins.map(adm => `<div class="list-row"><span>@${adm}</span></div>`).join('');

            const usersContainer = document.getElementById('users-list');
            if (data.users.length === 0) {
                usersContainer.innerHTML = '<div style="padding: 4px; color: #666;">Нет пользователей</div>';
                return;
            }

            usersContainer.innerHTML = data.users.map(u => `
                <div class="list-row">
                    <div>
                        <b>@${u.username || 'без юзернейма'}</b> <span style="color:#777; font-size:10px;">(${u.id})</span>
                        ${u.is_banned ? '<span style="color:red">[Бан]</span>' : ''}
                    </div>
                    <div style="display:flex; gap:4px;">
                        <button class="admin-btn" style="padding: 2px 6px; font-size: 10px;" onclick="userAction('${u.id}', '${u.username || ''}', 'reset')">Сброс</button>
                        <button class="admin-btn ban" style="padding: 2px 6px; font-size: 10px;" onclick="userAction('${u.id}', '${u.username || ''}', 'ban')">${u.is_banned ? 'Разбан' : 'Бан'}</button>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            console.error("Ошибка загрузки админ-данных", e);
        }
    }

    async function modifyAdmin(actionType) {
        const targetUsername = document.getElementById('admin-username-input').value.trim();
        if (!targetUsername) {
            alert('Введите юзернейм');
            return;
        }

        try {
            const res = await fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminId: userId, adminUsername: username, targetUsername, actionType })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) {
                document.getElementById('admin-username-input').value = '';
                loadAdminData();
            }
        } catch (e) {
            alert('Ошибка запроса');
        }
    }

    async function userAction(targetId, targetUsername, actionType) {
        try {
            const res = await fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminId: userId, adminUsername: username, targetId, targetUsername, actionType })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) loadAdminData();
        } catch (e) {
            alert('Ошибка запроса');
        }
    }

    function renderTrack(items) {
        const track = document.getElementById('track');
        track.innerHTML = '';
        const fullList = [...items, ...items, ...items, ...items];
        fullList.forEach(p => {
            track.innerHTML += `
                <div class="item-card">
                    <div class="item-icon">${p.icon}</div>
                    <div class="item-name">${p.name}</div>
                </div>
            `;
        });
    }

    function startTimer() {
        const spinBtn = document.getElementById('spin-button');
        spinBtn.disabled = true;

        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            const diff = nextSpinTimestamp - Date.now();
            if (diff <= 0) {
                clearInterval(timerInterval);
                setSpinButtonState(true, "КРУТИМ...");
                return;
            }

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            spinBtn.innerText = `Ждите: ${hours}ч ${minutes}м ${seconds}с`;
        }, 1000);
    }

    function setSpinButtonState(active, text) {
        const spinBtn = document.getElementById('spin-button');
        spinBtn.disabled = !active;
        spinBtn.innerText = text;
    }

    async function spinWheel() {
        if (isSpinning) return;
        isSpinning = true;
        setSpinButtonState(false, "РОЗЫГРЫШ...");

        try {
            const res = await fetch('/api/spin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, username })
            });
            const data = await res.json();

            if (!res.ok) {
                alert(data.error || "Ошибка прокрутки");
                isSpinning = false;
                initApp();
                return;
            }

            const track = document.getElementById('track');
            const winningIndex = prizes.findIndex(p => p.id === data.prize.id);
            const cardWidth = 110;
            const offset = (winningIndex + prizes.length * 2) * cardWidth - 140;
            
            track.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
            track.style.transform = `translateX(-${offset}px)`;

            setTimeout(() => {
                alert(`Поздравляем! Вы выиграли: ${data.prize.name}\nПромокод: ${data.promoCode}`);
                isSpinning = false;
                location.reload();
            }, 4200);

        } catch (e) {
            console.error(e);
            isSpinning = false;
            setSpinButtonState(true, "КРУТИМ...");
        }
    }

    async function loadInventory() {
        const listContainer = document.getElementById('inventory-list');
        listContainer.innerHTML = '<div style="text-align: center; color: #666; margin-top: 40px;">Загрузка...</div>';

        try {
            const res = await fetch(`/api/inventory?userId=${userId}`);
            const items = await res.json();

            if (items.length === 0) {
                listContainer.innerHTML = '<div style="text-align: center; color: #666; margin-top: 40px;">Инвентарь пуст</div>';
                return;
            }

            listContainer.innerHTML = '';
            items.forEach(item => {
                listContainer.innerHTML += `
                    <div class="inventory-item">
                        <div class="inv-info">
                            <div class="inv-icon">${item.icon}</div>
                            <div>
                                <div class="inv-name">${item.name}</div>
                                <div style="font-size: 10px; color: #8a8d98; margin-top: 2px;">${new Date(item.won_at).toLocaleDateString()}</div>
                            </div>
                        </div>
                        <div class="inv-code">${item.promo_code}</div>
                    </div>
                `;
            });
        } catch (e) {
            listContainer.innerHTML = '<div style="text-align: center; color: #ff4747; margin-top: 40px;">Ошибка загрузки</div>';
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));

        if (tabName === 'roulette') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('roulette-view').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('inventory-view').classList.add('active');
            loadInventory();
        }
    }

    initApp();
</script>

</body>
</html>
